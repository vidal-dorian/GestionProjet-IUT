name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Tests backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Déployer sur le Raspberry Pi
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          # Ne pas nettoyer l'arborescence : .env (non versionné) doit
          # survivre d'un run à l'autre, il n'est créé qu'une seule fois
          # manuellement lors de l'installation du runner (voir docs).
          clean: false

      - name: Construire et relancer les conteneurs
        run: docker compose up -d --build

      - name: Vérifier que l'application répond
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/health >/dev/null; then
              echo "Application opérationnelle."
              exit 0
            fi
            sleep 2
          done
          echo "L'application ne répond pas après le déploiement." >&2
          exit 1
