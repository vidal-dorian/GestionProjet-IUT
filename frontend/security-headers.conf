# En-têtes de sécurité, inclus dans chaque bloc qui déclare ses propres
# add_header (nginx n'hérite pas de ceux du bloc parent dans ce cas).

# Politique de contenu : uniquement les ressources du site lui-même. Bloque
# l'exécution de tout script injecté (XSS) et le chargement depuis d'autres
# domaines. 'unsafe-inline' pour les styles seulement (attributs style de
# React) ; blob: et data: pour l'aperçu des logos et les images générées.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Le site n'est servi qu'en HTTPS (Cloudflare) : le navigateur refusera
# désormais toute connexion en clair.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
