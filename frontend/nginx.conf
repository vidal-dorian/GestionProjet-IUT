server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité. nginx n'hérite pas des add_header d'un bloc parent
    # dès qu'un location en déclare : ils sont donc repris dans /index.html.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin reverse proxy to the backend: avoids CORS and keeps the
    # session cookie scoped to a single public hostname.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routes: fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Never cache the SPA shell: every visit must reach Cloudflare Access, so
    # that a logged-out (or expired) session is redirected to the Google
    # login instead of rendering a cached app whose API calls all fail.
    # Hashed assets under /assets/ stay cacheable.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
