server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas annoncer la version de nginx.
    server_tokens off;

    # Taille maximale d'une requête : les logos (1 Mo, encodés en base64 donc
    # ~1,4 Mo) sont les plus gros envois ; au-delà, nginx répond 413 avant
    # même d'atteindre le backend.
    client_max_body_size 2m;

    include /etc/nginx/snippets/security-headers.conf;

    # Same-origin reverse proxy to the backend: avoids CORS and keeps the
    # session cookie scoped to a single public hostname.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les réponses de l'API (données des projets) ne doivent jamais rester
        # dans un cache partagé ou dans celui du navigateur.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # React Router client-side routes: fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Never cache the SPA shell: every visit must reach Cloudflare Access, so
    # that a logged-out (or expired) session is redirected to the Google
    # login instead of rendering a cached app whose API calls all fail.
    # Hashed assets under /assets/ stay cacheable.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
